<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="0.5" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#243449" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand mark -->
  <text x="600" y="150" text-anchor="middle"
        font-family="'Space Mono', ui-monospace, monospace" font-size="40" font-weight="700"
        letter-spacing="2">
    <tspan fill="#22C55E">{</tspan><tspan fill="#94A3B8"> pdf2json </tspan><tspan fill="#22C55E">}</tspan>
  </text>

  <!-- headline -->
  <text x="600" y="320" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800"
        fill="#F8FAFC" letter-spacing="-2">Turn messy PDF tables</text>
  <text x="600" y="408" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800"
        fill="url(#g)" letter-spacing="-2">into clean JSON</text>

  <!-- subline -->
  <text x="600" y="492" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="500"
        fill="#94A3B8">Open-source · private · CLI &amp; browser</text>

  <!-- pill -->
  <rect x="468" y="540" width="264" height="52" rx="26" fill="#16352a" stroke="#22C55E" stroke-opacity="0.4"/>
  <text x="600" y="574" text-anchor="middle"
        font-family="'Space Mono', ui-monospace, monospace" font-size="22" font-weight="700"
        fill="#22C55E">$ pdf2json input.pdf</text>
</svg>
